# Pipeline Hyperparameters and Configuration
data_ingestion:
  test_size: 0.2
  random_state: 42
  blob_name: "balanced_sentiment_dataset.csv"
  local_fallback_path: "data/balanced_sentiment_dataset.csv"

feature_engineering:
  max_features: 10000
  max_df: 0.9
  min_df: 5
  ngram_range: [1, 2]

model_building:
  solver: "saga"
  penalty: "elasticnet"
  C: 1.0
  l1_ratio: 0.5
  max_iter: 500
  random_state: 42

model_evaluation:
  metric_threshold:
    min_accuracy: 0.75
    min_f1: 0.75